[package]
name = "openconkit-reporting"
description = "OpenConKit reporting: deterministic XLSX and embedded Typst PDF exports."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints.rust]
unsafe_code = "forbid"

[features]
default = []
pdf = ["dep:typst", "dep:typst-assets", "dep:typst-pdf"]

[dependencies]
rust_xlsxwriter.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
typst = { workspace = true, optional = true }
typst-assets = { workspace = true, optional = true }
typst-pdf = { workspace = true, optional = true }

[dev-dependencies]
calamine.workspace = true
hayro-interpret = "=0.7.0"
kurbo = "=0.13.1"
