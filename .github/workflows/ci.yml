name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend and contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26.4.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint and enforce architecture
        run: pnpm lint

      - name: Strict TypeScript
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      - name: Production frontend build
        run: pnpm build

      - name: Check production bundle contents
        run: pnpm bundle:check

      - name: Renderer end-to-end tests
        run: pnpm test:e2e

      - name: Version consistency
        run: pnpm version:check

      - name: Tool release completeness
        run: pnpm tool:completeness

  rust:
    name: Rust workspace
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            xdg-utils

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26.4.0

      - name: Stage verified Linux Codex sidecar
        run: node scripts/fetch-codex.mjs --target x86_64-unknown-linux-gnu

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Unit, integration, migration, and fixture tests
        run: cargo test --workspace --all-features --locked

      - name: Generated contract drift
        run: node scripts/contracts-check.mjs

      - name: Tauri compile smoke
        run: cargo check -p openconkit-desktop --locked

  supply-chain:
    name: Supply chain and secrets
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${RUNNER_TEMP}/${archive}" |
            sha256sum --check
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" \
            --directory "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26.4.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan for committed secrets
        run: pnpm security:secrets

      - name: Audit production npm dependencies
        run: pnpm audit --prod --audit-level high

      - name: Check production npm licenses
        run: pnpm licenses:check

      - name: Check committed third-party notices
        run: pnpm notices:check

      - name: Audit Rust advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.97.0"
          command: check
          arguments: --all-features
